name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore FinePdf.sln
      - run: dotnet build FinePdf.sln -c Release --no-restore
      - run: dotnet test FinePdf.sln -c Release --no-build --nologo

  windows:
    name: build (windows, net8.0-windows + GDI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build FinePdf.sln -c Release
      - run: dotnet test FinePdf.sln -c Release --no-build --nologo
