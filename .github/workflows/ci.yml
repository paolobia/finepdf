name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore FinePdf.sln
      - run: dotnet build FinePdf.sln -c Release --no-restore
      - run: dotnet test FinePdf.sln -c Release --no-build --nologo

  windows:
    name: build (windows, net8.0-windows + GDI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build FinePdf.sln -c Release
      - run: dotnet test FinePdf.sln -c Release --no-build --nologo

  cups-integration:
    name: stampante virtuale CUPS (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cups cups-client cups-filters ghostscript poppler-utils
      - name: avvia cupsd
        run: |
          sudo systemctl start cups 2>/dev/null || (sudo /usr/sbin/cupsd && sleep 2)
          lpstat -r || true
      - name: installa la stampante FinePdf
        run: |
          OUT="$(mktemp -d)"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          sudo packaging/linux/install.sh "$OUT"
          mkdir -p "$HOME/.config/FinePdf"
          printf '{ "printerOutputFolder": "%s" }\n' "$OUT" > "$HOME/.config/FinePdf/settings.json"
          lpstat -v FinePdf
      - name: stampa un file e verifica nome/pagine
        run: |
          printf 'FinePdf CI smoke test\n' > sample.txt
          lp -d FinePdf -t "CI Smoke" sample.txt
          for i in $(seq 1 30); do
            f=$(ls "$OUT"/*.pdf 2>/dev/null | head -1) && break
            sleep 1
          done
          test -n "$f" || { echo "nessun PDF prodotto"; sudo cat /var/log/cups/error_log; exit 1; }
          echo "prodotto: $f"
          basename "$f" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}(__.+)?\.pdf$'
          pdfinfo "$f" | grep -E 'Pages|Page size'
      - name: dimensione A3
        run: |
          lp -d FinePdf -o media=A3 -t "A3" sample.txt
          sleep 6
          a3=$(ls -t "$OUT"/*.pdf | head -1)
          pdfinfo "$a3" | grep -E 'Page size:[[:space:]]*8(41|42)'
      - name: 5 stampe concorrenti -> 5 nomi distinti
        run: |
          rm -f "$OUT"/*.pdf
          for i in 1 2 3 4 5; do lp -d FinePdf -t "conc $i" sample.txt & done
          wait
          for i in $(seq 1 30); do [ "$(ls "$OUT"/*.pdf 2>/dev/null | wc -l)" -ge 5 ] && break; sleep 1; done
          n=$(ls "$OUT"/*.pdf | wc -l)
          test "$n" -eq 5 || { ls -l "$OUT"; sudo cat /var/log/cups/error_log; exit 1; }
      - name: rimozione
        run: |
          sudo packaging/linux/uninstall.sh
          ! lpstat -v FinePdf
